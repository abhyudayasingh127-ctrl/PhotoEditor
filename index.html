<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoEdit Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233478F6'/><path d='M8 20l4-5 3 4 5-7 4 8H8z' fill='white' opacity='0.9'/><circle cx='12' cy='12' r='2' fill='white'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { 900: '#101318', 800: '#141920', 700: '#171D25', 600: '#1C2430', 500: '#28313D' },
            accent: { DEFAULT: '#3478F6', hover: '#2B68D9' },
            text: { primary: '#F1F4F8', secondary: '#9CA7B5', muted: '#6B7585' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: Inter, system-ui, sans-serif; background: #101318; color: #F1F4F8; }
    input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; background: #28313D; border-radius: 2px; outline: none; width: 100%; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #3478F6; border-radius: 50%; cursor: pointer; border: 2px solid #F1F4F8; }
    .checkerboard {
      background-color: #12161c;
      background-image: linear-gradient(45deg,#1a2028 25%,transparent 25%),linear-gradient(-45deg,#1a2028 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1a2028 75%),linear-gradient(-45deg,transparent 75%,#1a2028 75%);
      background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #28313D; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <script>
    const { useState, useRef, useCallback, useEffect, createElement: h } = React;

    const DEFAULT_ADJ = {
      brightness: 0, contrast: 0, saturation: 0, exposure: 0,
      temperature: 0, tint: 0, hue: 0, fade: 0, vignette: 0
    };

    const FILTERS = [
      { id: 'original', name: 'Original', css: '' },
      { id: 'natural', name: 'Natural', css: 'contrast(1.05) saturate(1.05)' },
      { id: 'warm', name: 'Warm', css: 'sepia(0.15) saturate(1.2) hue-rotate(-10deg)' },
      { id: 'cool', name: 'Cool', css: 'saturate(0.9) hue-rotate(15deg) brightness(1.02)' },
      { id: 'vintage', name: 'Vintage', css: 'sepia(0.4) contrast(0.95) brightness(0.95) saturate(0.85)' },
      { id: 'bw', name: 'B&W', css: 'grayscale(1)' },
      { id: 'mono', name: 'Mono', css: 'grayscale(1) contrast(1.15)' },
      { id: 'cinematic', name: 'Cinematic', css: 'contrast(1.2) saturate(0.85) brightness(0.95)' },
      { id: 'portrait', name: 'Portrait', css: 'contrast(1.05) brightness(1.05) saturate(0.95)' },
      { id: 'landscape', name: 'Landscape', css: 'contrast(1.1) saturate(1.25) brightness(1.02)' },
      { id: 'soft', name: 'Soft', css: 'brightness(1.05) contrast(0.9) saturate(0.9)' },
      { id: 'dramatic', name: 'Dramatic', css: 'contrast(1.35) saturate(1.1) brightness(0.95)' },
      { id: 'faded', name: 'Faded', css: 'contrast(0.85) brightness(1.08) saturate(0.75)' },
      { id: 'matte', name: 'Matte', css: 'contrast(0.9) brightness(1.05) saturate(0.85)' },
      { id: 'golden', name: 'Golden Hour', css: 'sepia(0.25) saturate(1.3) brightness(1.05) hue-rotate(-5deg)' },
      { id: 'film', name: 'Film', css: 'contrast(1.1) saturate(0.9) brightness(0.98)' },
      { id: 'highcontrast', name: 'High Contrast', css: 'contrast(1.4) saturate(1.05)' },
      { id: 'dreamy', name: 'Dreamy', css: 'brightness(1.08) contrast(0.9) saturate(1.1)' },
    ];

    function buildFilter(adj, filterId) {
      const parts = [];
      const b = 1 + adj.brightness / 100 + adj.exposure / 120;
      const c = 1 + adj.contrast / 100;
      const s = 1 + adj.saturation / 100;
      parts.push('brightness(' + b.toFixed(3) + ')');
      parts.push('contrast(' + c.toFixed(3) + ')');
      parts.push('saturate(' + s.toFixed(3) + ')');
      if (adj.hue) parts.push('hue-rotate(' + adj.hue + 'deg)');
      if (adj.temperature > 0) parts.push('sepia(' + (adj.temperature / 200).toFixed(3) + ')');
      else if (adj.temperature < 0) parts.push('hue-rotate(' + (adj.temperature / 4).toFixed(1) + 'deg)');
      if (adj.tint) parts.push('hue-rotate(' + (adj.tint / 5).toFixed(1) + 'deg)');
      if (adj.fade > 0) parts.push('opacity(' + (1 - adj.fade / 200).toFixed(3) + ')');
      const f = FILTERS.find(function(x) { return x.id === filterId; });
      if (f && f.css) parts.push(f.css);
      return parts.join(' ');
    }

    function Slider(props) {
      return h('div', { className: 'mb-4' },
        h('div', { className: 'flex justify-between mb-1.5' },
          h('label', { className: 'text-[13px] font-medium' }, props.label),
          h('span', { className: 'text-[12px] text-text-secondary tabular-nums w-10 text-right' },
            props.value > 0 ? '+' + props.value : props.value
          )
        ),
        h('input', {
          type: 'range',
          min: props.min != null ? props.min : -100,
          max: props.max != null ? props.max : 100,
          value: props.value,
          onChange: function(e) { props.onChange(+e.target.value); }
        }),
        props.desc ? h('p', { className: 'text-[11px] text-text-muted mt-1' }, props.desc) : null
      );
    }

    function App() {
      var fileRef = useRef();
      var imgRef = useRef();
      var srcState = useState(null);
      var src = srcState[0], setSrc = srcState[1];
      var filenameState = useState('image');
      var filename = filenameState[0], setFilename = filenameState[1];
      var sizeState = useState({ w: 0, h: 0 });
      var size = sizeState[0], setSize = sizeState[1];
      var adjState = useState(Object.assign({}, DEFAULT_ADJ));
      var adj = adjState[0], setAdj = adjState[1];
      var filterIdState = useState('original');
      var filterId = filterIdState[0], setFilterId = filterIdState[1];
      var rotationState = useState(0);
      var rotation = rotationState[0], setRotation = rotationState[1];
      var flipHState = useState(false);
      var flipH = flipHState[0], setFlipH = flipHState[1];
      var flipVState = useState(false);
      var flipV = flipVState[0], setFlipV = flipVState[1];
      var showOriginalState = useState(false);
      var showOriginal = showOriginalState[0], setShowOriginal = showOriginalState[1];
      var tabState = useState('adjust');
      var tab = tabState[0], setTab = tabState[1];
      var activeToolState = useState('adjust');
      var activeTool = activeToolState[0], setActiveTool = activeToolState[1];
      var exportOpenState = useState(false);
      var exportOpen = exportOpenState[0], setExportOpen = exportOpenState[1];
      var historyState = useState([]);
      var history = historyState[0], setHistory = historyState[1];
      var futureState = useState([]);
      var future = futureState[0], setFuture = futureState[1];
      var zoomState = useState(1);
      var zoom = zoomState[0], setZoom = zoomState[1];

      function snapshot() {
        return { adj: Object.assign({}, adj), filterId: filterId, rotation: rotation, flipH: flipH, flipV: flipV };
      }

      function pushHistory() {
        setHistory(function(h) { return h.concat([snapshot()]).slice(-40); });
        setFuture([]);
      }

      function loadFile(file) {
        if (!file.type.match(/^image\/(jpeg|jpg|png|webp)$/i)) {
          alert('Please use JPEG, PNG or WebP');
          return;
        }
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function() {
          if (src) URL.revokeObjectURL(src);
          setSrc(url);
          setFilename(file.name);
          setSize({ w: img.naturalWidth, h: img.naturalHeight });
          imgRef.current = img;
          setAdj(Object.assign({}, DEFAULT_ADJ));
          setFilterId('original');
          setRotation(0);
          setFlipH(false);
          setFlipV(false);
          setHistory([]);
          setFuture([]);
          setZoom(1);
        };
        img.onerror = function() {
          URL.revokeObjectURL(url);
          alert('Failed to load image');
        };
        img.src = url;
      }

      function undo() {
        if (!history.length) return;
        var prev = history[history.length - 1];
        setFuture(function(f) { return [snapshot()].concat(f); });
        setHistory(function(h) { return h.slice(0, -1); });
        setAdj(prev.adj);
        setFilterId(prev.filterId);
        setRotation(prev.rotation);
        setFlipH(prev.flipH);
        setFlipV(prev.flipV);
      }

      function redo() {
        if (!future.length) return;
        var next = future[0];
        setHistory(function(h) { return h.concat([snapshot()]); });
        setFuture(function(f) { return f.slice(1); });
        setAdj(next.adj);
        setFilterId(next.filterId);
        setRotation(next.rotation);
        setFlipH(next.flipH);
        setFlipV(next.flipV);
      }

      function changeAdj(key, val) {
        setAdj(function(a) {
          var n = Object.assign({}, a);
          n[key] = val;
          return n;
        });
      }

      function doExport(format) {
        if (!imgRef.current) return;
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        var img = imgRef.current;
        var rad = rotation * Math.PI / 180;
        var cos = Math.abs(Math.cos(rad));
        var sin = Math.abs(Math.sin(rad));
        var w = img.naturalWidth, hh = img.naturalHeight;
        canvas.width = Math.round(w * cos + hh * sin);
        canvas.height = Math.round(w * sin + hh * cos);
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(rad);
        ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
        ctx.filter = showOriginal ? 'none' : buildFilter(adj, filterId);
        ctx.drawImage(img, -w / 2, -hh / 2);
        if (adj.vignette > 0) {
          var g = ctx.createRadialGradient(0, 0, Math.min(w, hh) * 0.3, 0, 0, Math.max(w, hh) * 0.7);
          g.addColorStop(0, 'rgba(0,0,0,0)');
          g.addColorStop(1, 'rgba(0,0,0,' + (adj.vignette / 100 * 0.85) + ')');
          ctx.fillStyle = g;
          ctx.fillRect(-canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        }
        canvas.toBlob(function(blob) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          var name = filename.replace(/\.[^.]+$/, '') || 'edited';
          a.download = name + '.' + (format === 'jpeg' ? 'jpg' : format);
          a.click();
          setExportOpen(false);
        }, 'image/' + format, 0.92);
      }

      useEffect(function() {
        function handler(e) {
          if (e.target.tagName === 'INPUT') return;
          if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
          if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
          if ((e.ctrlKey || e.metaKey) && e.key === 'o') { e.preventDefault(); fileRef.current && fileRef.current.click(); }
          if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (src) setExportOpen(true); }
          if (e.key === 'Escape') { setExportOpen(false); setShowOriginal(false); }
        }
        window.addEventListener('keydown', handler);
        return function() { window.removeEventListener('keydown', handler); };
      });

      var cssFilter = showOriginal ? 'none' : buildFilter(adj, filterId);
      var transform = 'scale(' + zoom + ') rotate(' + rotation + 'deg) scaleX(' + (flipH ? -1 : 1) + ') scaleY(' + (flipV ? -1 : 1) + ')';

      var tools = [
        { id: 'adjust', label: 'Adjust' },
        { id: 'filters', label: 'Filters' },
        { id: 'rotate', label: 'Rotate 90°' },
        { id: 'flipH', label: 'Flip Horizontal' },
        { id: 'flipV', label: 'Flip Vertical' },
        { id: 'compare', label: 'Before / After' },
        { id: 'reset', label: 'Reset All' }
      ];

      function handleTool(id) {
        setActiveTool(id);
        if (id === 'rotate') { pushHistory(); setRotation(function(r) { return (r + 90) % 360; }); }
        else if (id === 'flipH') { pushHistory(); setFlipH(function(f) { return !f; }); }
        else if (id === 'flipV') { pushHistory(); setFlipV(function(f) { return !f; }); }
        else if (id === 'compare') setShowOriginal(function(v) { return !v; });
        else if (id === 'reset') {
          if (confirm('Reset all edits?')) {
            pushHistory();
            setAdj(Object.assign({}, DEFAULT_ADJ));
            setFilterId('original');
            setRotation(0);
            setFlipH(false);
            setFlipV(false);
          }
        } else if (id === 'filters') setTab('filters');
        else if (id === 'adjust') setTab('adjust');
      }

      // Build UI
      return h('div', { className: 'h-full flex flex-col bg-surface-900 text-text-primary' },

        // Top bar
        h('header', { className: 'h-14 shrink-0 flex items-center justify-between px-4 bg-surface-800 border-b border-surface-500' },
          h('div', { className: 'flex items-center gap-2 min-w-[160px]' },
            h('div', { className: 'w-8 h-8 rounded-md bg-accent flex items-center justify-center text-white font-bold text-sm' }, 'P'),
            h('span', { className: 'font-semibold text-[15px] hidden sm:block' }, 'PhotoEdit Studio')
          ),
          h('nav', { className: 'flex gap-1' },
            ['Edit', 'Filters', 'Effects'].map(function(s) {
              var t = s.toLowerCase() === 'edit' ? 'adjust' : s.toLowerCase();
              return h('button', {
                key: s,
                onClick: function() { setTab(t); },
                className: 'px-4 py-1.5 text-[13px] font-medium rounded-md ' +
                  (tab === t ? 'bg-accent/20 text-accent' : 'text-text-secondary hover:text-text-primary hover:bg-surface-600')
              }, s);
            })
          ),
          h('div', { className: 'flex items-center gap-1.5 min-w-[160px] justify-end' },
            h('button', {
              onClick: undo, disabled: !history.length,
              className: 'p-2 rounded-md text-text-secondary hover:bg-surface-600 disabled:opacity-30 text-lg',
              title: 'Undo (Ctrl+Z)'
            }, '↩'),
            h('button', {
              onClick: redo, disabled: !future.length,
              className: 'p-2 rounded-md text-text-secondary hover:bg-surface-600 disabled:opacity-30 text-lg',
              title: 'Redo'
            }, '↪'),
            h('div', { className: 'w-px h-5 bg-surface-500 mx-1' }),
            h('button', {
              onClick: function() { if (src) setExportOpen(true); },
              disabled: !src,
              className: 'px-3 py-1.5 rounded-md bg-accent hover:bg-accent-hover text-white text-[13px] font-medium disabled:opacity-40'
            }, 'Export')
          )
        ),

        // Main area
        h('div', { className: 'flex-1 flex overflow-hidden' },

          // Left sidebar
          h('aside', { className: 'w-[220px] shrink-0 bg-surface-800 border-r border-surface-500 flex flex-col overflow-hidden hidden md:flex' },
            h('div', { className: 'p-3 border-b border-surface-500' },
              h('button', {
                onClick: function() { fileRef.current && fileRef.current.click(); },
                className: 'w-full py-2.5 rounded-md bg-accent hover:bg-accent-hover text-white text-[13px] font-medium'
              }, 'Upload Image')
            ),
            h('div', { className: 'flex-1 overflow-y-auto py-2 px-1.5 space-y-0.5' },
              tools.map(function(t) {
                return h('button', {
                  key: t.id,
                  onClick: function() { handleTool(t.id); },
                  disabled: !src && t.id !== 'adjust',
                  className: 'w-full text-left px-2.5 py-2 rounded-md text-[13px] ' +
                    (activeTool === t.id ? 'bg-accent/15 text-accent border border-accent/30' : 'text-text-secondary hover:bg-surface-600 border border-transparent') +
                    ' disabled:opacity-40'
                }, t.label);
              })
            )
          ),

          // Workspace
          h('main', {
            className: 'flex-1 relative bg-surface-900 flex flex-col overflow-hidden',
            onDragOver: function(e) { e.preventDefault(); },
            onDrop: function(e) {
              e.preventDefault();
              var f = e.dataTransfer.files[0];
              if (f) loadFile(f);
            }
          },
            h('div', { className: 'flex-1 flex items-center justify-center overflow-hidden' },
              !src
                ? h('div', { className: 'text-center px-6' },
                    h('div', { className: 'w-20 h-20 mx-auto mb-4 rounded-2xl bg-surface-700 border border-surface-500 flex items-center justify-center text-3xl text-text-muted' }, '🖼'),
                    h('p', { className: 'text-[15px] font-medium mb-1' }, 'Drop an image here to start editing'),
                    h('p', { className: 'text-[13px] text-text-secondary mb-4' }, 'JPEG, PNG, or WebP'),
                    h('button', {
                      onClick: function() { fileRef.current && fileRef.current.click(); },
                      className: 'px-5 py-2.5 rounded-md bg-accent hover:bg-accent-hover text-white text-[13px] font-medium'
                    }, 'Upload Image')
                  )
                : h('div', { className: 'checkerboard rounded-sm shadow-2xl overflow-hidden' },
                    h('img', {
                      src: src,
                      alt: 'preview',
                      draggable: false,
                      className: 'max-w-[min(90vw,900px)] max-h-[calc(100vh-140px)] object-contain block',
                      style: { filter: cssFilter, transform: transform, transformOrigin: 'center' }
                    })
                  )
            ),
            src ? h('div', { className: 'absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-1 bg-surface-800/90 border border-surface-500 rounded-lg px-2 py-1.5' },
              h('button', { onClick: function() { setZoom(function(z) { return Math.max(0.25, z - 0.25); }); }, className: 'p-1.5 text-text-secondary hover:text-white' }, '−'),
              h('span', { className: 'text-[12px] w-12 text-center text-text-secondary' }, Math.round(zoom * 100) + '%'),
              h('button', { onClick: function() { setZoom(function(z) { return Math.min(2, z + 0.25); }); }, className: 'p-1.5 text-text-secondary hover:text-white' }, '+'),
              h('button', { onClick: function() { setZoom(1); }, className: 'p-1.5 text-text-secondary hover:text-white text-[12px] ml-1' }, 'Fit')
            ) : null
          ),

          // Right panel
          h('aside', { className: 'w-[300px] shrink-0 bg-surface-800 border-l border-surface-500 flex flex-col overflow-hidden hidden lg:flex' },
            h('div', { className: 'flex border-b border-surface-500' },
              ['adjust', 'filters', 'effects'].map(function(t) {
                return h('button', {
                  key: t,
                  onClick: function() { setTab(t); },
                  className: 'flex-1 py-3 text-[13px] font-medium capitalize relative ' +
                    (tab === t ? 'text-accent' : 'text-text-secondary hover:text-text-primary')
                },
                  t,
                  tab === t ? h('span', { className: 'absolute bottom-0 left-2 right-2 h-0.5 bg-accent rounded-full' }) : null
                );
              })
            ),
            h('div', { className: 'flex-1 overflow-y-auto p-4' },
              tab === 'adjust' ? h('div', null,
                h('div', { className: 'flex justify-between mb-4' },
                  h('h3', { className: 'text-[14px] font-semibold' }, 'Adjustments'),
                  h('button', {
                    onClick: function() { pushHistory(); setAdj(Object.assign({}, DEFAULT_ADJ)); },
                    className: 'text-[12px] text-accent hover:underline'
                  }, 'Reset All')
                ),
                h(Slider, { label: 'Brightness', value: adj.brightness, onChange: function(v) { changeAdj('brightness', v); }, desc: 'Overall brightness' }),
                h(Slider, { label: 'Contrast', value: adj.contrast, onChange: function(v) { changeAdj('contrast', v); } }),
                h(Slider, { label: 'Saturation', value: adj.saturation, onChange: function(v) { changeAdj('saturation', v); } }),
                h(Slider, { label: 'Exposure', value: adj.exposure, onChange: function(v) { changeAdj('exposure', v); } }),
                h(Slider, { label: 'Temperature', value: adj.temperature, onChange: function(v) { changeAdj('temperature', v); }, desc: 'Warm / Cool' }),
                h(Slider, { label: 'Tint', value: adj.tint, onChange: function(v) { changeAdj('tint', v); } }),
                h(Slider, { label: 'Hue', value: adj.hue, min: -180, max: 180, onChange: function(v) { changeAdj('hue', v); } }),
                h(Slider, { label: 'Fade', value: adj.fade, min: 0, max: 100, onChange: function(v) { changeAdj('fade', v); } }),
                h(Slider, { label: 'Vignette', value: adj.vignette, min: 0, max: 100, onChange: function(v) { changeAdj('vignette', v); } })
              ) : null,

              tab === 'filters' ? h('div', null,
                h('h3', { className: 'text-[14px] font-semibold mb-3' }, 'Filters'),
                h('div', { className: 'grid grid-cols-3 gap-2' },
                  FILTERS.map(function(f) {
                    return h('button', {
                      key: f.id,
                      onClick: function() { pushHistory(); setFilterId(f.id); },
                      className: 'rounded-md overflow-hidden border-2 ' +
                        (filterId === f.id ? 'border-accent' : 'border-transparent hover:border-surface-500')
                    },
                      h('div', {
                        className: 'aspect-square bg-surface-600 overflow-hidden',
                        style: { filter: f.css || 'none' }
                      },
                        src
                          ? h('img', { src: src, className: 'w-full h-full object-cover', draggable: false })
                          : h('div', { className: 'w-full h-full bg-surface-600' })
                      ),
                      h('div', { className: 'py-1 text-[11px] text-center bg-surface-700 truncate' }, f.name)
                    );
                  })
                )
              ) : null,

              tab === 'effects' ? h('p', { className: 'text-[13px] text-text-secondary' },
                'Core adjustments and filters are fully working. Advanced effects coming soon.'
              ) : null
            )
          )
        ),

        // Hidden file input
        h('input', {
          ref: fileRef,
          type: 'file',
          accept: 'image/jpeg,image/png,image/webp',
          className: 'hidden',
          onChange: function(e) {
            var f = e.target.files && e.target.files[0];
            if (f) loadFile(f);
            e.target.value = '';
          }
        }),

        // Export modal
        exportOpen ? h('div', {
          className: 'fixed inset-0 z-50 flex items-center justify-center bg-black/60',
          onClick: function() { setExportOpen(false); }
        },
          h('div', {
            className: 'bg-surface-700 border border-surface-500 rounded-xl w-full max-w-md p-5',
            onClick: function(e) { e.stopPropagation(); }
          },
            h('h2', { className: 'text-[16px] font-semibold mb-4' }, 'Export Image'),
            h('p', { className: 'text-[13px] text-text-secondary mb-4' }, size.w + ' × ' + size.h + ' px · ' + filename),
            h('div', { className: 'flex gap-2 mb-4' },
              ['jpeg', 'png', 'webp'].map(function(f) {
                return h('button', {
                  key: f,
                  onClick: function() { doExport(f); },
                  className: 'flex-1 py-2.5 rounded-md bg-accent hover:bg-accent-hover text-white text-[13px] font-medium capitalize'
                }, f.toUpperCase());
              })
            ),
            h('button', {
              onClick: function() { setExportOpen(false); },
              className: 'w-full py-2 rounded-md bg-surface-600 text-[13px]'
            }, 'Cancel')
          )
        ) : null
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
